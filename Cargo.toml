[package]
name = "space"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.16.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
avian3d = { version = "0.3.1", default-features = false, features = ["3d", "f64", "parry-f64", "parallel", "debug-plugin"] }

# Terrain generation is math-heavy; keep our own code reasonably optimized in dev builds
# and fully optimize dependencies (Bevy) so the game runs smoothly while iterating.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
